# Deploy pipeline for northbridge-aml-api
# Stages: build → publish-to-exchange → deploy-sandbox → deploy-production
#
# Exchange publish uses 'mvn deploy' via the mule-maven-plugin (extensions=true)
# which sends the correct Mule asset format that the Exchange Maven facade expects.
# The deploy:deploy-file approach was abandoned because it sends a plain JAR
# without Mule metadata, causing Exchange to reset the connection.

name: Deploy northbridge-aml-api

on:
  push:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.9'
  ANYPOINT_ORG_ID: 0d2dd5dc-4a01-4180-a12a-0c3c4d888c7b
  PRIVATE_SPACE: mcp-private-space
  CH2_REPLICAS: 1
  CH2_VCORES: '0.1'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and package the application. No tests are run.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build
        run: mvn -B package -DskipTests -f northbridge-aml-api/pom.xml -s settings.xml
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/northbridge-aml-api-*-mule-application.jar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Publish to Anypoint Exchange via mule-maven-plugin deploy phase.
  # Re-packages inline (fast, no Java compilation) so the plugin can attach
  # the correct Mule asset metadata that Exchange requires.
  # ---------------------------------------------------------------------------
  publish-to-exchange:
    name: Publish to Exchange
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Verify Connected App credentials
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" \
            --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}")
          echo "Token endpoint HTTP status: ${HTTP}"
          [ "${HTTP}" = "200" ] || { echo "Credential check failed (status ${HTTP})"; exit 1; }
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers>\n'
                 '    <server>\n'
                 '      <id>anypoint-exchange-v3</id>\n'
                 '      <username>~~~Client~~~</username>\n'
                 f'      <password>{cid}~?~{cs}</password>\n'
                 '    </server>\n'
                 '  </servers>\n'
                 '</settings>\n')
          with open('/tmp/mvn-settings.xml', 'w') as f:
              f.write(xml)
          print('Settings file written')
          PYEOF
      - name: Publish to Anypoint Exchange
        # Uses 'mvn deploy' via the mule-maven-plugin (extensions=true). The plugin
        # publishes the packaged Mule application to Exchange using the correct
        # asset format. -DmuleDeploy=false prevents any CloudHub deployment attempt.
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B deploy -DskipTests -DmuleDeploy=false \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml

  # ---------------------------------------------------------------------------
  # Job 3: Deploy the published artifact to CloudHub 2.0 Sandbox.
  # Downloads the pre-built jar — no recompilation.
  # ---------------------------------------------------------------------------
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: publish-to-exchange
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers>\n'
                 '    <server>\n'
                 '      <id>anypoint-exchange-v3</id>\n'
                 '      <username>~~~Client~~~</username>\n'
                 f'      <password>{cid}~?~{cs}</password>\n'
                 '    </server>\n'
                 '  </servers>\n'
                 '</settings>\n')
          with open('/tmp/mvn-settings.xml', 'w') as f:
              f.write(xml)
          print('Settings file written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Sandbox
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Sandbox \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}

  # ---------------------------------------------------------------------------
  # Job 4: Deploy the same artifact to CloudHub 2.0 Production.
  # Gated by the 'production' GitHub Environment (required reviewer).
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers>\n'
                 '    <server>\n'
                 '      <id>anypoint-exchange-v3</id>\n'
                 '      <username>~~~Client~~~</username>\n'
                 f'      <password>{cid}~?~{cs}</password>\n'
                 '    </server>\n'
                 '  </servers>\n'
                 '</settings>\n')
          with open('/tmp/mvn-settings.xml', 'w') as f:
              f.write(xml)
          print('Settings file written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Production
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Production \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}
