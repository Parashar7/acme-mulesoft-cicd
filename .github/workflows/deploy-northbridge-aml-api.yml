# Deploy pipeline for northbridge-aml-api
# Stages: build → publish-to-exchange → deploy-sandbox → deploy-production

name: Deploy northbridge-aml-api

on:
  push:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  # mule-maven-plugin 4.7.0 uses maven-resolver 1.x API which is incompatible with
  # Maven 4 (maven-resolver 2.x). Pin to Maven 3.9.x until the plugin is updated.
  MAVEN_VERSION: '3.9.9'
  ANYPOINT_ORG_ID: 0d2dd5dc-4a01-4180-a12a-0c3c4d888c7b
  PRIVATE_SPACE: mcp-private-space
  CH2_REPLICAS: 1
  CH2_VCORES: '0.1'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and package the application. No tests are run.
  # Runs for every push and pull request. Does NOT receive deploy secrets,
  # so forked PR runs are safe.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build
        run: |
          mvn -B package -DskipTests \
            -f northbridge-aml-api/pom.xml \
            -s settings.xml

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/northbridge-aml-api-*-mule-application.jar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Publish the pre-built jar to Anypoint Exchange.
  # Skipped on pull requests so secrets are never exposed to forked PRs.
  # Uses the 'sandbox' GitHub Environment for the Connected App credentials.
  # ---------------------------------------------------------------------------
  publish-to-exchange:
    name: Publish to Exchange
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/

      - name: Publish to Anypoint Exchange
        # The groupId is overridden to the Anypoint org ID, which Exchange requires.
        # Credentials are injected as environment variables; they are never echoed.
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          JAR=$(find northbridge-aml-api/target -name '*-mule-application.jar' | head -1)
          mvn -B deploy:deploy-file \
            -Dfile="${JAR}" \
            -DgroupId="${{ env.ANYPOINT_ORG_ID }}" \
            -DartifactId=northbridge-aml-api \
            -Dversion=1.0.0-SNAPSHOT \
            -Dclassifier=mule-application \
            -Dpackaging=jar \
            -DgeneratePom=false \
            -DrepositoryId=anypoint-exchange-v3 \
            -Durl="https://maven.anypoint.mulesoft.com/api/v3/organizations/${{ env.ANYPOINT_ORG_ID }}/maven" \
            -s settings.xml

  # ---------------------------------------------------------------------------
  # Job 3: Deploy the published artifact to CloudHub 2.0 Sandbox.
  # Downloads the pre-built jar — no recompilation.
  # The mule-maven-plugin polls until replicas are running; the step fails if
  # replicas do not reach a started state within the plugin's timeout.
  # ---------------------------------------------------------------------------
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: publish-to-exchange
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/

      - name: Deploy to CloudHub 2.0 Sandbox
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Sandbox \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}

  # ---------------------------------------------------------------------------
  # Job 4: Deploy the same artifact to CloudHub 2.0 Production.
  # Gated by the 'production' GitHub Environment, which requires a reviewer
  # approval before the job runs.
  # Downloads the pre-built jar — no rebuild, no re-test.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/

      - name: Deploy to CloudHub 2.0 Production
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Production \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}
