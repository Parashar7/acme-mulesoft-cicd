# Deploy pipeline for northbridge-aml-api
# Stages: build → deploy-sandbox → deploy-production
#
# Target is set in the app POM as <target>Cloudhub-US-East-1</target>
# (CloudHub 2.0 Shared Space – US East Ohio).

name: Deploy northbridge-aml-api

on:
  push:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.9'
  ANYPOINT_ORG_ID: 0d2dd5dc-4a01-4180-a12a-0c3c4d888c7b
  CH2_REPLICAS: 1
  CH2_VCORES: '0.1'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build
        run: mvn -B package -DskipTests -f northbridge-aml-api/pom.xml -s settings.xml
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/northbridge-aml-api-*-mule-application.jar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to CloudHub 2.0 Sandbox.
  # Secrets: ANYPOINT_CLIENT_ID / ANYPOINT_CLIENT_SECRET in the 'sandbox'
  # GitHub Environment — Connected App with Create/Read Applications scopes.
  # Target is taken from the app POM: Cloudhub-US-East-1 (Shared Space).
  # ---------------------------------------------------------------------------
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers><server>\n'
                 '    <id>anypoint-exchange-v3</id>\n'
                 '    <username>~~~Client~~~</username>\n'
                 f'    <password>{cid}~?~{cs}</password>\n'
                 '  </server></servers>\n'
                 '</settings>\n')
          open('/tmp/mvn-settings.xml', 'w').write(xml)
          print('Settings written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Sandbox
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B package mule:deploy -DskipTests \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Sandbox \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to CloudHub 2.0 Production.
  # Gated by the 'production' GitHub Environment (required reviewer).
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers><server>\n'
                 '    <id>anypoint-exchange-v3</id>\n'
                 '    <username>~~~Client~~~</username>\n'
                 f'    <password>{cid}~?~{cs}</password>\n'
                 '  </server></servers>\n'
                 '</settings>\n')
          open('/tmp/mvn-settings.xml', 'w').write(xml)
          print('Settings written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Production
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B package mule:deploy -DskipTests \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Production \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}
