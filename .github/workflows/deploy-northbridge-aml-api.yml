# Deploy pipeline for northbridge-aml-api
# Stages: build → publish-to-exchange (non-blocking) → deploy-sandbox → deploy-production
#
# Exchange publish is continue-on-error so CloudHub deploys proceed even while
# Exchange publish is being debugged.

name: Deploy northbridge-aml-api

on:
  push:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'northbridge-aml-api/**'
      - 'mule-parent-pom/**'
      - 'settings.xml'
      - '.github/workflows/deploy-northbridge-aml-api.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.9'
  ANYPOINT_ORG_ID: 0d2dd5dc-4a01-4180-a12a-0c3c4d888c7b
  PRIVATE_SPACE: mcp-private-space
  CH2_REPLICAS: 1
  CH2_VCORES: '0.1'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and package. Does NOT receive deploy secrets.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build
        run: mvn -B package -DskipTests -f northbridge-aml-api/pom.xml -s settings.xml
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/northbridge-aml-api-*-mule-application.jar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Publish to Anypoint Exchange.
  # continue-on-error: true — Exchange publish does not block CloudHub deploy.
  # Tries the Exchange 2 REST API directly with a Bearer token.
  # ---------------------------------------------------------------------------
  publish-to-exchange:
    name: Publish to Exchange
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sandbox
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/
      - name: Publish to Anypoint Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          ACCESS_TOKEN=$(curl -sf \
            -X POST "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${ANYPOINT_CLIENT_ID}" \
            --data-urlencode "client_secret=${ANYPOINT_CLIENT_SECRET}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          JAR=$(find northbridge-aml-api/target -name '*-mule-application.jar' | head -1)
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('northbridge-aml-api/pom.xml'); ns={'m':'http://maven.apache.org/POM/4.0.0'}; print(t.find('m:version',ns).text)")
          ORG="${{ env.ANYPOINT_ORG_ID }}"

          echo "Publishing ${JAR} as version ${VERSION} to org ${ORG}"

          # Try Exchange 2 REST API (org-path variant)
          HTTP=$(curl -s -o /tmp/exchange-response.json -w "%{http_code}" \
            -X POST "https://anypoint.mulesoft.com/exchange/api/v2/organizations/${ORG}/assets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -F "organizationId=${ORG}" \
            -F "groupId=${ORG}" \
            -F "assetId=northbridge-aml-api" \
            -F "version=${VERSION}" \
            -F "name=northbridge-aml-api" \
            -F "type=app" \
            -F "classifier=mule-application" \
            -F "packaging=jar" \
            -F "main=@${JAR};type=application/java-archive")
          echo "Exchange /organizations/{orgId}/assets HTTP status: ${HTTP}"
          cat /tmp/exchange-response.json; echo

          if [ "${HTTP}" = "200" ] || [ "${HTTP}" = "201" ]; then
            echo "Exchange publish succeeded"; exit 0
          fi

          # Fallback: try without org prefix in URL
          HTTP2=$(curl -s -o /tmp/exchange-response2.json -w "%{http_code}" \
            -X POST "https://anypoint.mulesoft.com/exchange/api/v2/assets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -F "organizationId=${ORG}" \
            -F "groupId=${ORG}" \
            -F "assetId=northbridge-aml-api" \
            -F "version=${VERSION}" \
            -F "name=northbridge-aml-api" \
            -F "type=app" \
            -F "classifier=mule-application" \
            -F "packaging=jar" \
            -F "main=@${JAR};type=application/java-archive")
          echo "Exchange /assets HTTP status: ${HTTP2}"
          cat /tmp/exchange-response2.json; echo

          [ "${HTTP2}" = "200" ] || [ "${HTTP2}" = "201" ] || { echo "Exchange publish failed (${HTTP} / ${HTTP2})"; exit 1; }

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to CloudHub 2.0 Sandbox.
  # Depends on build (NOT on publish-to-exchange) so it runs regardless of
  # Exchange publish outcome.
  # ---------------------------------------------------------------------------
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers>\n'
                 '    <server>\n'
                 '      <id>anypoint-exchange-v3</id>\n'
                 '      <username>~~~Client~~~</username>\n'
                 f'      <password>{cid}~?~{cs}</password>\n'
                 '    </server>\n'
                 '  </servers>\n'
                 '</settings>\n')
          with open('/tmp/mvn-settings.xml', 'w') as f:
              f.write(xml)
          print('Settings file written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Sandbox
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Sandbox \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}

  # ---------------------------------------------------------------------------
  # Job 4: Deploy to CloudHub 2.0 Production.
  # Gated by the 'production' GitHub Environment (required reviewer).
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-sandbox
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: Install Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${{ env.MAVEN_VERSION }}/binaries/apache-maven-${{ env.MAVEN_VERSION }}-bin.tar.gz \
            | tar xz -C /opt
          echo "/opt/apache-maven-${{ env.MAVEN_VERSION }}/bin" >> "$GITHUB_PATH"
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: northbridge-aml-api/target/
      - name: Write Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os
          cid = os.environ['ANYPOINT_CLIENT_ID']
          cs  = os.environ['ANYPOINT_CLIENT_SECRET']
          xml = ('<?xml version="1.0" encoding="UTF-8"?>\n'
                 '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">\n'
                 '  <servers>\n'
                 '    <server>\n'
                 '      <id>anypoint-exchange-v3</id>\n'
                 '      <username>~~~Client~~~</username>\n'
                 f'      <password>{cid}~?~{cs}</password>\n'
                 '    </server>\n'
                 '  </servers>\n'
                 '</settings>\n')
          with open('/tmp/mvn-settings.xml', 'w') as f:
              f.write(xml)
          print('Settings file written')
          PYEOF
      - name: Deploy to CloudHub 2.0 Production
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B mule:deploy \
            -f northbridge-aml-api/pom.xml \
            -s /tmp/mvn-settings.xml \
            -Pcloudhub2 \
            -Danypoint.org.id="${{ env.ANYPOINT_ORG_ID }}" \
            -Danypoint.environment=Production \
            -Danypoint.private.space="${{ env.PRIVATE_SPACE }}" \
            -Dcloudhub2.replicas=${{ env.CH2_REPLICAS }} \
            -Dcloudhub2.vcores=${{ env.CH2_VCORES }}
